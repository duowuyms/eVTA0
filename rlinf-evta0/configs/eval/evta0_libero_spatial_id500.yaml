# Fixed-initial-state evaluation on libero_spatial (10 tasks x 50 trials).
# Runs a trained policy checkpoint; no reward model is needed at eval time.
#
# Pass the checkpoint to score via:  runner.ckpt_path=/path/to/full_weights.pt
defaults:
  - env/libero_spatial@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env: 0-0
    rollout: 0-0

runner:
  task_type: embodied_eval
  logger:
    log_path: ./outputs/evta0_liberospatial_eval
    project_name: rlinf
    experiment_name: evta0_liberospatial_fixed_id500
    logger_backends: [tensorboard]
  max_epochs: 1
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  eval_rng_seed: 42
  resume_dir: null
  ckpt_path: null

env:
  group_name: EnvGroup
  eval:
    rollout_epoch: 50
    total_num_envs: 10
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    seed: 42
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: false
    is_eval: true
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  unnorm_key: libero_10
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: /path/to/pi05_libero_sft   # pi0.5 policy the checkpoint was trained from
    model_type: openpi
    precision: null
    num_action_chunks: 10
    num_steps: 5
    openpi:
      noise_level: 0.5

reward:
  use_reward_model: false

critic:
  use_critic_model: false
