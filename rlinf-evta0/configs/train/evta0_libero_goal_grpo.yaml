# Policy RL on libero_goal with a frozen eVTA0 reward (GRPO).
#
# The eVTA0 history window is defined by reward.model.context_window /
# frame_interval (defaults 5 / 2, i.e. [t-8, t-6, t-4, t-2, t]) over raw
# action frames, zero-left padded at episode start.  Rewards are r = P(success) - 1 with the environment's
# terminal success anchoring the first-success chunk.
#
# Prerequisites (see README.md):
#   - RLinf checkout at the pinned commit with this overlay applied
#   - the evta0 package (PYTHONPATH or reward.model.evta0_package_path)
#   - a pi0.5 SFT policy checkpoint (rollout/actor model_path)
#   - an eVTA0 checkpoint (reward.model.checkpoint_path)

defaults:
  - env/libero_goal@env.train
  - env/libero_goal@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/bucket_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor:
      node_group: policy_runtime
      placement: 0-0
    env:
      node_group: policy_runtime
      placement: 2-2
    rollout:
      node_group: policy_runtime
      placement: 2-2
    reward:
      node_group: reward_runtime
      placement: 1-1
  node_groups:
    - label: policy_runtime
      node_ranks: 0-0
      env_configs:
        - node_ranks: 0-0
          python_interpreter_path: ${oc.env:RLINF_DRIVER_PYTHON}
    - label: reward_runtime
      node_ranks: 0-0
      env_configs:
        - node_ranks: 0-0
          python_interpreter_path: ${oc.env:RLINF_REWARD_PYTHON}

runner:
  task_type: embodied
  logger:
    log_path: ./outputs/evta0_libergoal_grpo
    project_name: rlinf
    experiment_name: evta0_libergoal_grpo_seed42
    logger_backends: [tensorboard]
  max_epochs: 50
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 5
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 8
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 2
  adv_type: grpo
  loss_type: actor
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 8
    total_num_envs: 16
    auto_reset: false
    ignore_terminations: false
    max_episode_steps: 320
    max_steps_per_rollout_epoch: 320
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    seed: 42
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: false
    video_cfg:
      save_video: false
  eval:
    rollout_epoch: 1
    total_num_envs: 1
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 320
    max_steps_per_rollout_epoch: 320
    group_size: 1
    seed: 42
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: false
    is_eval: true
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  unnorm_key: libero_10
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: /path/to/pi05_libero_sft   # pi0.5 SFT policy checkpoint
    precision: ${actor.model.precision}
    num_steps: 5

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 4
  # 16 envs * 8 rollout epochs * (320 / 10) = 4096 chunk samples.
  # At global_batch_size=64 and update_epoch=2 this is 128 Adam steps/update.
  global_batch_size: 64
  seed: 42
  enable_offload: true
  model:
    model_path: /path/to/pi05_libero_sft   # pi0.5 SFT policy checkpoint
    num_action_chunks: 10
    num_steps: 5
    precision: null
    is_lora: false
    openpi:
      train_expert_only: true
  optim:
    lr: 2.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    use_orig_params: false
    save_full_model_weights: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: true
  group_name: RewardGroup
  reward_mode: history_buffer
  reward_output_transform: probability_minus_one   # r = P(success) - 1
  terminal_success_anchor: true
  history_reward_assign: false
  reward_weight: 1.0
  env_reward_weight: 0.0                            # pure learned reward
  model:
    model_type: evta0
    checkpoint_path: /path/to/model/libero/checkpoint.pth   # eVTA0 checkpoint
    evta0_package_path: /path/to/evta0                    # dir containing the evta0/ package
    model_path: Qwen/Qwen3-VL-4B-Instruct                 # base VLM (hub id or local path)
    precision: bf16
    device_map: current_device
    lora_rank: 16
    lora_alpha: 32
    lora_dropout: 0.05
    infer_micro_batch_size: 4
    interval_reward: 0.0
    history_source: raw_action_frames
    context_window: 5
    frame_interval: 2
    padding_policy: zero_left
    history_buffer_name: evta0_context
    history_buffers:
      evta0_context:
        history_size: 5
        min_history_size: 1
        input_interval: 1
        input_on_done: true
        history_keys:
          - main_images
          - wrist_images
          - states
          - task_descriptions

critic:
  use_critic_model: false
